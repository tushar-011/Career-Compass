<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment | Career Compass</title>
    <link rel="stylesheet" href="assessment.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="container">

    <h1>Student Assessment Form</h1>
    <p class="subtitle">Help us understand you better to build your career roadmap</p>

    <form id="assessmentForm">

        <!-- BASIC INFO -->
        <div class="section">
            <h2>Basic Information</h2>

            <div class="grid">
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Middle Name">
                <input type="text" placeholder="Last Name" required>

                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <input type="tel" placeholder="Phone Number" required>
                <input type="email" placeholder="Email ID" required>
            </div>
        </div>

        <!-- ACADEMIC -->
        <div class="section">
            <h2>Academic Background</h2>

            <div class="grid">
                <input type="text" placeholder="Current Qualification (e.g. 12th, B.Tech)">
                <input type="text" placeholder="Stream (Science / Commerce / Arts)">
                <input type="number" placeholder="Percentage / CGPA">
            </div>
        </div>

        <!-- INTEREST -->
        <div class="section">
            <h2>Interests & Goals</h2>

            <textarea placeholder="What subjects or fields excite you the most?"></textarea>

            <textarea placeholder="What do you want to become in future?"></textarea>
        </div>

        <!-- SKILLS -->
        <div class="section">
            <h2>Skills & Preferences</h2>

            <textarea placeholder="List your current skills (coding, communication, etc.)"></textarea>

            <select>
                <option value="">Preferred Work Style</option>
                <option>Technical</option>
                <option>Creative</option>
                <option>Management</option>
            </select>

            <select>
                <option value="">Work Preference</option>
                <option>Remote</option>
                <option>Office</option>
                <option>Hybrid</option>
            </select>
        </div>

        <!-- CAREER -->
        <div class="section">
            <h2>Career Intent</h2>

            <select>
                <option value="">Goal Type</option>
                <option>High Salary</option>
                <option>Passion Based</option>
                <option>Balanced</option>
            </select>

            <select>
                <option value="">Preferred Industry</option>
                <option>IT</option>
                <option>Finance</option>
                <option>Healthcare</option>
                <option>Business</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Submit Assessment</button>

    </form>
</div>

<script src="assessment.js"></script>
</body>
</html>
